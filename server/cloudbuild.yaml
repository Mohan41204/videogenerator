steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'server/Dockerfile'
      - '-t'
      - 'asia-south1-docker.pkg.dev/sky-meet-01/video-generator/video-generator-backend:$COMMIT_SHA'
      - 'server'

  # 2. Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/sky-meet-01/video-generator/video-generator-backend:$COMMIT_SHA'

  # 3. Deploy/Update Cloud Run API Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'video-generator-backend'
      - '--image=asia-south1-docker.pkg.dev/sky-meet-01/video-generator/video-generator-backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--port=5000'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=60s'
      - '--concurrency=80'
      - '--min=0'
      - '--max=5'
      - '--service-account=video-generator-run@sky-meet-01.iam.gserviceaccount.com'
      - '--set-env-vars=NODE_ENV=production,GOOGLE_CLOUD_PROJECT=sky-meet-01,GOOGLE_CLOUD_LOCATION=global,CLOUD_RUN_JOB_NAME=video-generator-job,CLOUD_RUN_JOB_REGION=asia-south1,GCS_BUCKET_NAME=sky-meet-01-video-generator,ENABLE_MULTILINGUAL_AUDIO=true,GOOGLE_GENAI_USE_VERTEXAI=true,VIDEO_RENDER_FPS=3,TRANSLATION_CONCURRENCY=3,TTS_CONCURRENCY=2,IMAGE_GENERATION_CONCURRENCY=2,RENDER_CONCURRENCY=2'
      - '--allow-unauthenticated'

  # 4. Deploy/Update Cloud Run Job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'video-generator-job'
      - '--image=asia-south1-docker.pkg.dev/sky-meet-01/video-generator/video-generator-backend:$COMMIT_SHA'
      - '--command=node'
      - '--args=jobs/videoGeneration.job.js'
      - '--region=asia-south1'
      - '--tasks=1'
      - '--max-retries=1'
      - '--cpu=4'
      - '--memory=8Gi'
      - '--task-timeout=3600s'
      - '--service-account=video-generator-run@sky-meet-01.iam.gserviceaccount.com'
      - '--set-env-vars=NODE_ENV=production,GOOGLE_CLOUD_PROJECT=sky-meet-01,GOOGLE_CLOUD_LOCATION=global,CLOUD_RUN_JOB_NAME=video-generator-job,CLOUD_RUN_JOB_REGION=asia-south1,GCS_BUCKET_NAME=sky-meet-01-video-generator,ENABLE_MULTILINGUAL_AUDIO=true,GOOGLE_GENAI_USE_VERTEXAI=true,VIDEO_RENDER_FPS=3,TRANSLATION_CONCURRENCY=3,TTS_CONCURRENCY=2,IMAGE_GENERATION_CONCURRENCY=2,RENDER_CONCURRENCY=2'

images:
  - 'asia-south1-docker.pkg.dev/sky-meet-01/video-generator/video-generator-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY